<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة تحكم TD بالعربي</title>
<style>
:root{--bg:#0e0f12;--s:#17181d;--s2:#202229;--b:#2a2c34;--t:#ececef;--m:#9aa0ad;--a:#dc2626;--a2:#f87171;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--r:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--t);line-height:1.6;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--a2)}
.hide{display:none!important}
#login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.card{background:var(--s);border:1px solid var(--b);border-radius:var(--r);padding:18px}
#login .card{width:100%;max-width:380px;text-align:center;padding:32px}
h1{font-size:1.4rem}h2{font-size:1.15rem;margin-bottom:10px}h3{font-size:1rem;margin-bottom:8px}
input,select,textarea{width:100%;background:var(--s2);border:1px solid var(--b);border-radius:8px;padding:10px 12px;margin:6px 0;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--a)}
textarea{min-height:140px;resize:vertical}
label{font-size:.85rem;color:var(--m);display:block;margin-top:8px}
.btn{background:var(--a);color:#fff;border:0;border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:700}
.btn:hover{filter:brightness(1.1)}.btn.sec{background:var(--s2);color:var(--t);border:1px solid var(--b)}.btn.bad{background:#7f1d1d}.btn.sm{padding:5px 11px;font-size:.82rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
#app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav{background:var(--s);border-left:1px solid var(--b);padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto}
nav .logo{font-weight:800;font-size:1.15rem;padding:6px 10px 14px}nav .logo span{color:var(--a2)}
nav button{display:flex;gap:10px;align-items:center;width:100%;text-align:right;background:none;border:0;border-radius:8px;padding:10px 12px;cursor:pointer;color:var(--m);font-weight:600;margin-bottom:2px}
nav button.on,nav button:hover{background:var(--s2);color:var(--t)}
nav button.on{box-shadow:inset -3px 0 var(--a)}
main{padding:20px;min-width:0;max-width:1100px;width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat b{display:block;font-size:1.7rem;line-height:1.2}.stat span{color:var(--m);font-size:.82rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;border-radius:20px;padding:1px 10px;font-size:.75rem;font-weight:700;background:var(--s2);color:var(--m)}
.pill.ok{background:#14532d;color:#86efac}.pill.warn{background:#78350f;color:#fcd34d}.pill.bad{background:#7f1d1d;color:#fca5a5}
table{width:100%;border-collapse:collapse;font-size:.88rem}th,td{text-align:right;padding:8px 6px;border-bottom:1px solid var(--b);vertical-align:top}
th{color:var(--m);font-weight:600}
.bar{height:10px;background:var(--s2);border-radius:6px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--a)}
.note{color:var(--m);font-size:.85rem}
.alert{border:1px solid var(--b);border-right:4px solid var(--warn);background:var(--s);padding:10px 14px;border-radius:8px;margin-bottom:10px;font-size:.9rem}
.alert.bad{border-right-color:var(--bad)}.alert.ok{border-right-color:var(--ok)}
#toast{position:fixed;bottom:18px;left:18px;right:18px;max-width:420px;margin:auto;background:var(--s2);border:1px solid var(--b);padding:10px 16px;border-radius:10px;z-index:99;display:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-start;justify-content:center;padding:20px;overflow:auto;z-index:50}
.modal .card{width:100%;max-width:720px;margin:auto}
.art{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--b);align-items:flex-start}
.art img{width:84px;height:56px;object-fit:cover;border-radius:6px;flex:none;background:var(--s2)}
.art .tt{flex:1;min-width:0}.art .tt a{color:var(--t);font-weight:700;text-decoration:none}
@media(max-width:820px){
 #app{grid-template-columns:1fr}
 nav{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;display:flex;overflow-x:auto;border-left:0;border-top:1px solid var(--b);z-index:40;padding:4px}
 nav .logo{display:none}nav button{flex-direction:column;gap:0;font-size:.68rem;padding:6px 10px;width:auto;white-space:nowrap;box-shadow:none!important}
 main{padding:14px 12px 90px}.art img{width:64px;height:44px}
}
</style>
</head>
<body>
<div id="login"><div class="card">
  <h1>TD <span style="color:var(--a2)">بالعربي</span></h1>
  <p class="note" style="margin:6px 0 16px">لوحة التحكم</p>
  <input type="password" id="pw" placeholder="كلمة المرور" dir="ltr" autocomplete="current-password">
  <div id="lerr" class="note hide" style="color:var(--bad)">كلمة المرور غير صحيحة</div>
  <button class="btn" style="width:100%;margin-top:8px" id="lbtn">دخول</button>
</div></div>

<div id="app" class="hide">
 <nav id="nav">
  <div class="logo">TD <span>بالعربي</span></div>
  <button data-t="home" class="on">📊 نظرة عامة</button>
  <button data-t="articles">📰 المقالات</button>
  <button data-t="pipe">⚙️ النشر والترند</button>
  <button data-t="ads">💰 الإعلانات</button>
  <button data-t="push">🔔 الإشعارات</button>
  <button data-t="health">🩺 الفحص</button>
  <button data-t="set">🔧 الإعدادات</button>
  <button id="logout" style="margin-top:14px">↩︎ خروج</button>
 </nav>
 <main>
  <section id="t-home"></section>
  <section id="t-articles" class="hide"></section>
  <section id="t-pipe" class="hide"></section>
  <section id="t-ads" class="hide"></section>
  <section id="t-push" class="hide"></section>
  <section id="t-health" class="hide"></section>
  <section id="t-set" class="hide"></section>
 </main>
</div>
<div id="toast"></div>
<div class="modal" id="modal"><div class="card" id="mbody"></div></div>

<script>
'use strict';
/* TD Arabi admin v2. Reads public data from the repo. Writes (edit/delete/add, ads, push, run) need a GitHub token
   typed by the owner in Settings and kept ONLY in this browser (localStorage). No secrets are stored in the repo. */
var REPO = 'OsamaELfeky567/techdosenews';
var API = 'https://api.github.com/repos/' + REPO;
var RAW = 'https://raw.githubusercontent.com/' + REPO + '/main';
var BASE_PER_DAY = 6, MAX_PER_DAY = 15;
var D = { articles: [], hist: [], site: {}, runs: [], cats: [] };
function $(s) { return document.querySelector(s); }
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function toast(m, ms) { var t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(function () { t.style.display = 'none'; }, ms || 3500); }
function tok() { return localStorage.getItem('td_gh_token') || ''; }
function ago(d) { var m = Math.round((Date.now() - new Date(d)) / 60000); if (isNaN(m)) return '—'; if (m < 60) return 'منذ ' + m + ' دقيقة'; if (m < 2880) return 'منذ ' + Math.round(m / 60) + ' ساعة'; return 'منذ ' + Math.round(m / 1440) + ' يوم'; }
function cairo(d) { try { return new Date(d).toLocaleString('ar-EG', { timeZone: 'Africa/Cairo', dateStyle: 'medium', timeStyle: 'short' }); } catch (e) { return d; } }
function utf8b64(s) { return btoa(unescape(encodeURIComponent(s))); }

/* ---- GitHub helpers ---- */
async function gh(path, opt) {
  opt = opt || {}; var h = Object.assign({ Accept: 'application/vnd.github+json' }, opt.headers || {});
  if (tok()) h.Authorization = 'Bearer ' + tok();
  var r = await fetch(API + path, Object.assign({}, opt, { headers: h }));
  return r;
}
async function readRepoJSON(path) {   // public read, always fresh
  var r = await fetch(RAW + '/' + path + '?t=' + Date.now()); if (!r.ok) throw new Error(path + ' HTTP ' + r.status);
  return r.json();
}
async function fileMeta(path) { var r = await gh('/contents/' + path + '?ref=main'); if (!r.ok) throw new Error('GitHub ' + r.status + (r.status === 401 || r.status === 403 ? ' (الرمز غير صالح أو بلا صلاحية)' : '')); return r.json(); }
async function readFresh(path) {      // token read (fresh + sha); raw media type so files over 1 MB work
  var meta = await fileMeta(path);
  var r = await gh('/contents/' + path + '?ref=main', { headers: { Accept: 'application/vnd.github.raw+json' } });
  return { sha: meta.sha, json: await r.json() };
}
async function commitJSON(path, obj, msg) {
  if (!tok()) throw new Error('أدخل رمز GitHub في الإعدادات أولا');
  var cur = await readFresh(path);
  var body = { message: msg, branch: 'main', sha: cur.sha, content: utf8b64(JSON.stringify(obj, null, 2) + '\n') };
  var r = await gh('/contents/' + path, { method: 'PUT', body: JSON.stringify(body) });
  if (!r.ok) { var e = await r.json().catch(function () { return {}; }); throw new Error(e.message || ('HTTP ' + r.status)); }
  return r.json();
}
async function dispatch(file, inputs) {
  if (!tok()) throw new Error('أدخل رمز GitHub في الإعدادات أولا');
  var r = await gh('/actions/workflows/' + file + '/dispatches', { method: 'POST', body: JSON.stringify({ ref: 'main', inputs: inputs || {} }) });
  if (r.status !== 204) { var e = await r.json().catch(function () { return {}; }); throw new Error(e.message || ('HTTP ' + r.status)); }
}

/* ---- login (client-side gate; real protection for writes is the GitHub token) ---- */
async function sha256(s) { var h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return Array.from(new Uint8Array(h)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join(''); }
async function login() {
  var pw = $('#pw').value.trim(), cfg;
  try { cfg = await readRepoJSON('admin_config.json'); } catch (e) { $('#lerr').textContent = 'تعذر تحميل الإعدادات'; $('#lerr').classList.remove('hide'); return; }
  if (cfg.passwordHash && (await sha256(pw)) === cfg.passwordHash) { sessionStorage.setItem('td_admin', '1'); start(); }
  else { $('#lerr').textContent = 'كلمة المرور غير صحيحة'; $('#lerr').classList.remove('hide'); }
}
$('#lbtn').onclick = login; $('#pw').onkeydown = function (e) { if (e.key === 'Enter') login(); };
$('#logout').onclick = function () { sessionStorage.removeItem('td_admin'); location.reload(); };

/* ---- data ---- */
async function loadAll() {
  var res = await Promise.allSettled([readRepoJSON('data/articles/index.json'), readRepoJSON('data/execution_history.json'), readRepoJSON('data/site.json'), readRepoJSON('data/categories.json'),
    fetch(API + '/actions/runs?per_page=15').then(function (r) { return r.json(); })]);
  D.articles = res[0].value || []; D.hist = res[1].value || []; D.site = res[2].value || {}; D.cats = res[3].value || [];
  D.runs = (res[4].value && res[4].value.workflow_runs) || [];
}
var catName = function (id) { var c = D.cats.find(function (x) { return x.id === id; }); return c ? c.name : id; };
function todayUTC() { return new Date().toISOString().slice(0, 10); }
function todayArticles() { var t = todayUTC(); return D.articles.filter(function (a) { return (a.date || '').slice(0, 10) === t; }); }
function pubArticles() { return D.articles.filter(function (a) { return a.status === 'published'; }); }

/* ---- tabs ---- */
document.querySelectorAll('nav button[data-t]').forEach(function (b) { b.onclick = function () { show(b.dataset.t); }; });
function show(t) {
  document.querySelectorAll('nav button[data-t]').forEach(function (b) { b.classList.toggle('on', b.dataset.t === t); });
  document.querySelectorAll('main section').forEach(function (s) { s.classList.toggle('hide', s.id !== 't-' + t); });
  ({ home: rHome, articles: rArticles, pipe: rPipe, ads: rAds, push: rPush, health: rHealth, set: rSet })[t]();
  scrollTo(0, 0);
}
async function start() {
  $('#login').classList.add('hide'); $('#app').classList.remove('hide');
  $('#t-home').innerHTML = '<p class="note">جاري التحميل…</p>'; await loadAll(); show('home');
}

/* ---- overview ---- */
function runPill(r) { var c = r.conclusion || r.status; var cls = c === 'success' ? 'ok' : (c === 'failure' || c === 'cancelled' ? 'bad' : 'warn'); return '<span class="pill ' + cls + '">' + esc(c) + '</span>'; }
function rHome() {
  var pub = pubArticles(), last = pub[0], tdy = todayArticles().length;
  var genRuns = D.runs.filter(function (r) { return /generate/i.test(r.name || ''); });
  var sched = genRuns.filter(function (r) { return r.event === 'schedule'; });
  var alerts = '';
  if (last) { var h = (Date.now() - new Date(last.date)) / 36e5; if (h > 8) alerts += '<div class="alert bad">آخر خبر منشور ' + ago(last.date) + '. تأكد من الجدولة في تبويب «النشر والترند».</div>'; }
  if (!sched.length) alerts += '<div class="alert">لا توجد تشغيلات مجدولة حديثة في السجل. التشغيل اليدوي متاح من «النشر والترند».</div>';
  if (!tok()) alerts += '<div class="alert">وضع القراءة فقط. لتفعيل التعديل والنشر اليدوي أدخل رمز GitHub في «الإعدادات».</div>';
  $('#t-home').innerHTML = '<h1 style="margin-bottom:14px">نظرة عامة</h1>' + alerts +
    '<div class="grid"><div class="card stat"><b>' + pub.length + '</b><span>مقال منشور</span></div>' +
    '<div class="card stat"><b>' + tdy + ' / ' + MAX_PER_DAY + '</b><span>منشور اليوم (حد أعلى ' + MAX_PER_DAY + ')</span></div>' +
    '<div class="card stat"><b>' + (last ? ago(last.date) : '—') + '</b><span>آخر خبر</span></div>' +
    '<div class="card stat"><b>' + (genRuns[0] ? runPill(genRuns[0]) : '—') + '</b><span>آخر تشغيل للنشر</span></div></div>' +
    '<div class="card" style="margin-bottom:14px"><h2>آخر المقالات</h2>' + pub.slice(0, 6).map(artRow).join('') + '</div>' +
    '<div class="card"><h2>آخر تشغيلات النشر</h2>' + histTable(D.hist.slice(0, 8)) + '</div>';
}
function histTable(h) {
  if (!h.length) return '<p class="note">لا يوجد سجل بعد.</p>';
  return '<table><tr><th>الوقت</th><th>الحالة</th><th>الخبر / السبب</th></tr>' + h.map(function (x) {
    var ok = x.status === 'published', cls = ok ? 'ok' : (/fail|error|fatal/.test(x.status) ? 'bad' : 'warn');
    var why = x.title || ((x.errors || [])[0] || '').slice(0, 90);
    return '<tr><td>' + esc(cairo(x.at)) + '</td><td><span class="pill ' + cls + '">' + esc(x.status) + '</span></td><td>' + esc(why) + '</td></tr>';
  }).join('') + '</table>';
}
function artRow(a, withActions) {
  var url = a.path || ('/article.html?id=' + a.id);
  var tr = a.trend_score ? ' <span class="pill warn">ترند ' + a.trend_score + '</span>' : '';
  var rum = a.is_rumor ? ' <span class="pill warn">تسريب</span>' : '';
  var st = a.status !== 'published' ? ' <span class="pill bad">' + esc(a.status) + '</span>' : '';
  return '<div class="art"><img loading="lazy" src="' + esc(a.image || '') + '" alt=""><div class="tt"><a href="' + esc(url) + '" target="_blank" rel="noopener">' + (a.no ? '<span class="pill">#' + a.no + '</span> ' : '') + esc(a.title) + '</a>' + st + rum + tr +
    '<div class="note">' + esc(cairo(a.date)) + ' · ' + esc(catName(a.category)) + ' · ' + esc(a.source || '') + '</div>' +
    (withActions ? '<div class="row" style="margin-top:6px"><button class="btn sec sm" onclick="editArt(\'' + esc(a.id) + '\')">تعديل</button>' +
      (a.status === 'published' ? '<button class="btn sec sm" onclick="setStatus(\'' + esc(a.id) + '\',\'draft\')">إخفاء</button>' : '<button class="btn sec sm" onclick="setStatus(\'' + esc(a.id) + '\',\'published\')">نشر</button>') +
      '<button class="btn bad sm" onclick="delArt(\'' + esc(a.id) + '\')">حذف</button></div>' : '') + '</div></div>';
}

/* ---- articles ---- */
var AQ = '';
function rArticles() {
  var q = AQ.toLowerCase();
  var list = D.articles.filter(function (a) { return !q || (a.title || '').toLowerCase().indexOf(q) > -1 || (a.source || '').toLowerCase().indexOf(q) > -1; });
  $('#t-articles').innerHTML = '<h1 style="margin-bottom:12px">المقالات <span class="note">(' + D.articles.length + ' منشور · آخر رقم #' + Math.max.apply(null, [0].concat(D.articles.map(function (a) { return a.no || 0; }))) + ')</span></h1>' +
    '<div class="row" style="margin-bottom:12px"><input id="aq" placeholder="بحث بالعنوان أو المصدر" value="' + esc(AQ) + '" style="flex:1;min-width:180px;margin:0"><button class="btn" onclick="newArt()">+ مقال جديد</button></div>' +
    '<div class="card">' + (list.slice(0, 60).map(function (a) { return artRow(a, true); }).join('') || '<p class="note">لا نتائج</p>') + (list.length > 60 ? '<p class="note" style="margin-top:8px">أول 60 نتيجة من ' + list.length + '. استخدم البحث.</p>' : '') + '</div>' +
    '<p class="note" style="margin-top:10px">التعديل والحذف يُحفظان في GitHub ثم يُعاد بناء الصفحات والخرائط تلقائيا خلال دقيقة تقريبا.</p>';
  $('#aq').oninput = function () { AQ = this.value; var p = this.selectionStart; rArticles(); var el = $('#aq'); el.focus(); el.setSelectionRange(p, p); };
}
function modal(html) { $('#mbody').innerHTML = html; $('#modal').style.display = 'flex'; }
function closeM() { $('#modal').style.display = 'none'; }
$('#modal').onclick = function (e) { if (e.target === this) closeM(); };
function catOpts(sel) { return D.cats.map(function (c) { return '<option value="' + esc(c.id) + '"' + (c.id === sel ? ' selected' : '') + '>' + esc(c.name) + '</option>'; }).join(''); }
function artForm(a, isNew) {
  return '<h2>' + (isNew ? 'مقال جديد' : 'تعديل المقال') + '</h2>' +
    '<label>العنوان</label><input id="f-title" value="' + esc(a.title) + '">' +
    '<label>الملخص</label><textarea id="f-ex" style="min-height:70px">' + esc(a.excerpt) + '</textarea>' +
    '<label>وصف السيو (meta description)</label><input id="f-meta" value="' + esc(a.meta_description) + '">' +
    '<label>التصنيف</label><select id="f-cat">' + catOpts(a.category) + '</select>' +
    '<label>رابط الصورة</label><input id="f-img" dir="ltr" value="' + esc(a.image) + '">' +
    (isNew ? '<label>اسم المصدر</label><input id="f-src" value=""><label>رابط المصدر</label><input id="f-link" dir="ltr" value=""><label>Slug إنجليزي للرابط (حروف وأرقام وشرطات)</label><input id="f-slug" dir="ltr" value="">' : '') +
    '<label>المحتوى (HTML بسيط: p, h2, ul, li, strong)</label><textarea id="f-body" style="min-height:240px" dir="auto">' + esc(a.body) + '</textarea>' +
    '<div class="row" style="margin-top:12px"><button class="btn" id="f-save">حفظ</button><button class="btn sec" onclick="closeM()">إلغاء</button></div>';
}
function cleanHtml(h) { return String(h || '').replace(/<(script|style|iframe|object|embed|form)[\s\S]*?<\/\1>/gi, '').replace(/\son\w+\s*=\s*("[^"]*"|'[^']*')/gi, '').replace(/javascript:/gi, ''); }
async function mutate(fn, msg) {
  try {
    toast('جاري الحفظ…', 8000);
    var cur = await readFresh('data/articles/index.json'); var arr = fn(cur.json);
    await commitJSON('data/articles/index.json', arr, msg);
    D.articles = arr; toast('تم الحفظ. الصفحات تُحدَّث خلال دقيقة تقريبا.'); rArticles();
  } catch (e) { toast('فشل: ' + e.message, 7000); }
}
function editArt(id) {
  var a = D.articles.find(function (x) { return x.id === id; }); if (!a) return;
  modal(artForm(a, false));
  $('#f-save').onclick = function () {
    var t = $('#f-title').value.trim(); if (t.length < 10) return toast('العنوان قصير');
    closeM();
    mutate(function (arr) { var x = arr.find(function (y) { return y.id === id; }); if (!x) throw new Error('المقال غير موجود');
      x.title = t; x.excerpt = $('#f-ex').value.trim(); x.meta_description = $('#f-meta').value.trim(); x.category = $('#f-cat').value; x.image = $('#f-img').value.trim(); x.body = cleanHtml($('#f-body').value); x.modified = new Date().toISOString(); return arr; }, 'Admin: edit article ' + id);
  };
}
function setStatus(id, st) { mutate(function (arr) { var x = arr.find(function (y) { return y.id === id; }); if (!x) throw new Error('المقال غير موجود'); x.status = st; x.modified = new Date().toISOString(); return arr; }, 'Admin: ' + st + ' ' + id); }
function delArt(id) {
  var a = D.articles.find(function (x) { return x.id === id; });
  modal('<h2>حذف المقال؟</h2><p>' + esc(a && a.title) + '</p><p class="note">سيُحذف نهائيا من الموقع. (للإخفاء المؤقت استخدم «إخفاء».)</p><div class="row" style="margin-top:12px"><button class="btn bad" id="dok">حذف</button><button class="btn sec" onclick="closeM()">إلغاء</button></div>');
  $('#dok').onclick = function () { closeM(); mutate(function (arr) { return arr.filter(function (y) { return y.id !== id; }); }, 'Admin: delete ' + id); };
}
function newArt() {
  modal(artForm({ title: '', excerpt: '', meta_description: '', category: (D.cats[0] || {}).id, image: '', body: '' }, true));
  $('#f-save').onclick = function () {
    var t = $('#f-title').value.trim(), body = cleanHtml($('#f-body').value);
    if (t.length < 10 || body.length < 200) return toast('العنوان أو المحتوى قصير');
    var slug = ($('#f-slug').value || 'article').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) || 'article';
    var id = 'art-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
    var words = body.replace(/<[^>]+>/g, ' ').split(/\s+/).filter(Boolean).length;
    var entry = { id: id, title: t, excerpt: $('#f-ex').value.trim() || t, body: body, category: $('#f-cat').value, tags: [], image: $('#f-img').value.trim(), image_source: 'manual', date: new Date().toISOString(),
      readTime: Math.max(2, Math.round(words / 200)) + ' min read', views: 0, source: $('#f-src').value.trim(), link: $('#f-link').value.trim(), source_title: '', status: 'published',
      seo_title: t, meta_description: $('#f-meta').value.trim() || $('#f-ex').value.trim(), seo_slug: slug, quality_score: 0, ai_provider: 'manual' };
    closeM();
    (async function () { var c = await readFresh('data/article-counter.json').catch(function () { return null; }); var nx = (c && c.json && c.json.next) || (Math.max.apply(null, [0].concat(D.articles.map(function (a) { return a.no || 0; }))) + 1); entry.no = nx; await commitJSON('data/article-counter.json', { next: nx + 1 }, 'Admin: article counter ' + nx); mutate(function (arr) { return [entry].concat(arr); }, 'Admin: add article #' + nx + ' ' + id); })();
  };
}

/* ---- pipeline / trend ---- */
function rPipe() {
  var tdy = todayArticles(), n = tdy.length;
  var runs = D.runs.filter(function (r) { return /generate/i.test(r.name || ''); }).slice(0, 8);
  var trend = pubArticles().filter(function (a) { return a.trend_score; }).slice(0, 8);
  $('#t-pipe').innerHTML = '<h1 style="margin-bottom:12px">النشر والترند</h1>' +
    '<div class="card" style="margin-bottom:14px"><h2>حصة اليوم (UTC)</h2><div>' + n + ' من ' + MAX_PER_DAY + ' · أول ' + BASE_PER_DAY + ' بجودة عادية، الباقي للترند فقط</div>' +
    '<div class="bar"><i style="width:' + Math.min(100, n / MAX_PER_DAY * 100) + '%"></i></div>' +
    '<div class="row" style="margin-top:8px"><button class="btn" id="runnow">تشغيل النشر الآن</button><button class="btn sec" id="rundry">تجربة بدون نشر</button></div>' +
    '<p class="note" style="margin-top:8px">التشغيل يعمل على GitHub Actions (يحتاج الرمز). الجدولة التلقائية كل ساعة؛ تعمل فقط داخل الحصة.</p></div>' +
    '<div class="card" style="margin-bottom:14px"><h2>تشغيلات GitHub Actions</h2>' + (runs.length ? '<table><tr><th>الوقت</th><th>النوع</th><th>النتيجة</th></tr>' + runs.map(function (r) { return '<tr><td>' + esc(cairo(r.created_at)) + '</td><td>' + esc(r.event) + '</td><td>' + runPill(r) + ' <a href="' + esc(r.html_url) + '" target="_blank" rel="noopener">فتح</a></td></tr>'; }).join('') + '</table>' : '<p class="note">لا تشغيلات حديثة.</p>') + '</div>' +
    '<div class="card" style="margin-bottom:14px"><h2>سجل النشر</h2>' + histTable(D.hist.slice(0, 15)) + '</div>' +
    '<div class="card"><h2>أقوى الأخبار ترندا (آخر المنشور)</h2>' + (trend.length ? trend.map(function (a) { return artRow(a); }).join('') : '<p class="note">لم يُنشر خبر بدرجة ترند بعد. الدرجة تظهر في الأخبار الجديدة.</p>') + '</div>';
  $('#runnow').onclick = function () { dispatch('generate.yml', { dry_run: 'false' }).then(function () { toast('بدأ التشغيل. النتيجة في السجل خلال دقيقتين.'); }).catch(function (e) { toast('فشل: ' + e.message, 7000); }); };
  $('#rundry').onclick = function () { dispatch('generate.yml', { dry_run: 'true' }).then(function () { toast('بدأت التجربة (لا تنشر شيئا).'); }).catch(function (e) { toast('فشل: ' + e.message, 7000); }); };
}

/* ---- ads ---- */
var SLOTS = [['728x90', 'بانر عريض (ديسكتوب: أعلى وأسفل المقال)'], ['300x250', 'مستطيل (داخل المقال، الرئيسية)'], ['160x600', 'عمودي (جانب المقال)'], ['320x50', 'بانر موبايل'], ['468x60', 'بانر متوسط']];
function rAds() {
  var ads = D.site.ads || {}, off = D.site.ads_disabled || [];
  $('#t-ads').innerHTML = '<h1 style="margin-bottom:12px">الإعلانات</h1><div class="card"><table><tr><th>المقاس</th><th>الاستخدام</th><th>الحالة</th><th></th></tr>' + SLOTS.map(function (s) {
    var has = !!ads[s[0]], dis = off.indexOf(s[0]) > -1;
    return '<tr><td dir="ltr">' + s[0] + '</td><td>' + s[1] + '</td><td>' + (!has ? '<span class="pill">لا يوجد مفتاح</span>' : (dis ? '<span class="pill bad">متوقف</span>' : '<span class="pill ok">يعمل</span>')) + '</td><td>' + (has ? '<button class="btn sec sm" onclick="toggleAd(\'' + s[0] + '\')">' + (dis ? 'تشغيل' : 'إيقاف') + '</button>' : '') + '</td></tr>';
  }).join('') + '</table></div>' +
    '<p class="note" style="margin-top:10px">الإيقاف يخفي المقاس من صفحات المقالات فقط ويُطبَّق بعد إعادة البناء (دقيقة تقريبا). لا يغيّر شيئا في حساب Adsterra نفسه. قواعد الكثافة: إعلان واحد لكل شاشة على الموبايل وإعلانان على الديسكتوب.</p>';
}
async function toggleAd(sz) {
  try {
    toast('جاري الحفظ…', 8000);
    var cur = await readFresh('data/site.json'); var s = cur.json; s.ads_disabled = s.ads_disabled || [];
    var i = s.ads_disabled.indexOf(sz); if (i > -1) s.ads_disabled.splice(i, 1); else s.ads_disabled.push(sz);
    await commitJSON('data/site.json', s, 'Admin: ad slot ' + sz + (i > -1 ? ' on' : ' off')); D.site = s; toast('تم. يُطبّق بعد إعادة البناء.'); rAds();
  } catch (e) { toast('فشل: ' + e.message, 7000); }
}

/* ---- push ---- */
function rPush() {
  $('#t-push').innerHTML = '<h1 style="margin-bottom:12px">الإشعارات</h1><div class="card"><p class="note" style="margin-bottom:8px">كل خبر جديد يرسل إشعارا تلقائيا بعد نشره. من هنا ترسل إشعارا يدويا لكل المشتركين.</p>' +
    '<label>العنوان</label><input id="p-t" maxlength="80"><label>النص</label><input id="p-m" maxlength="160"><label>الرابط</label><input id="p-u" dir="ltr" value="https://td-arabi.com/">' +
    '<div class="row" style="margin-top:10px"><button class="btn" id="p-send">إرسال لكل المشتركين</button></div></div>' +
    '<p class="note" style="margin-top:10px">يتطلب سر ONESIGNAL_API_KEY في GitHub Actions. الإرسال يتم عبر مسار push-manual.</p>';
  $('#p-send').onclick = function () {
    var t = $('#p-t').value.trim(), m = $('#p-m').value.trim(), u = $('#p-u').value.trim();
    if (!t || !m || u.indexOf('https://td-arabi.com') !== 0) return toast('أكمل العنوان والنص، والرابط من td-arabi.com');
    if (!confirm('إرسال هذا الإشعار لكل المشتركين؟')) return;
    dispatch('push-manual.yml', { title: t, message: m, url: u }).then(function () { toast('تم الإرسال للمعالجة. يصل خلال ثوان.'); }).catch(function (e) { toast('فشل: ' + e.message, 7000); });
  };
}

/* ---- health ---- */
async function chk(path, test) {
  var t0 = performance.now();
  try { var r = await fetch(path + (path.indexOf('?') > -1 ? '&' : '?') + 'hc=' + Date.now(), { cache: 'no-store' }); var txt = await r.text(); var ms = Math.round(performance.now() - t0); var extra = test ? test(txt) : ''; return { path: path, ok: r.ok && extra !== false, code: r.status, ms: ms, note: typeof extra === 'string' ? extra : '' }; }
  catch (e) { return { path: path, ok: false, code: 0, ms: 0, note: 'خطأ شبكة' }; }
}
async function rHealth() {
  $('#t-health').innerHTML = '<h1 style="margin-bottom:12px">فحص الموقع</h1><p class="note">جاري الفحص…</p>';
  var pub = pubArticles(), first = pub[0], art = first && (first.path || '');
  var rs = await Promise.all([
    chk('/'), chk('/news/'), chk('/robots.txt'),
    chk('/sitemap.xml', function (t) { return t.indexOf('<sitemapindex') > -1 ? 'فهرس خرائط' : false; }),
    chk('/news-sitemap.xml', function (t) { var n = (t.match(/<news:news>/g) || []).length; return n + ' خبر في آخر 48 ساعة'; }),
    chk('/rss.xml', function (t) { return t.indexOf('<item>') > -1 ? '' : false; }),
    chk('/data/articles/index.json'), chk('/js/push.js'),
    art ? chk(art, function (t) { return (t.indexOf('NewsArticle') > -1 && t.indexOf('rel="canonical"') > -1 && t.indexOf('og:image') > -1) ? 'canonical + og + NewsArticle' : false; }) : Promise.resolve({ path: '(لا مقال)', ok: false, code: 0, ms: 0, note: '' })
  ]);
  var h = first ? (Date.now() - new Date(first.date)) / 36e5 : 999;
  var fresh = { path: 'حداثة آخر خبر', ok: h < 8, code: '', ms: '', note: first ? ago(first.date) : '—' };
  var sched = D.runs.filter(function (r) { return r.event === 'schedule'; }).length;
  var sc = { path: 'تشغيلات مجدولة في السجل', ok: sched > 0, code: '', ms: '', note: sched + '' };
  var all = rs.concat([fresh, sc]), bad = all.filter(function (x) { return !x.ok; }).length;
  $('#t-health').innerHTML = '<h1 style="margin-bottom:12px">فحص الموقع</h1><div class="alert ' + (bad ? 'bad' : 'ok') + '">' + (bad ? bad + ' فحص يحتاج انتباه' : 'كل الفحوصات سليمة') + '</div>' +
    '<div class="card"><table><tr><th>الفحص</th><th>الحالة</th><th>ملاحظة</th></tr>' + all.map(function (x) {
      return '<tr><td dir="ltr" style="text-align:right">' + esc(x.path) + '</td><td><span class="pill ' + (x.ok ? 'ok' : 'bad') + '">' + (x.ok ? 'سليم' : 'مشكلة') + (x.code ? ' ' + x.code : '') + '</span>' + (x.ms ? ' <span class="note">' + x.ms + 'ms</span>' : '') + '</td><td>' + esc(x.note) + '</td></tr>';
    }).join('') + '</table></div><div class="row" style="margin-top:12px"><button class="btn sec" onclick="rHealth()">إعادة الفحص</button></div>';
}

/* ---- settings ---- */
function rSet() {
  $('#t-set').innerHTML = '<h1 style="margin-bottom:12px">الإعدادات</h1>' +
    '<div class="card" style="margin-bottom:14px"><h2>رمز GitHub</h2><p class="note">لتفعيل التعديل والحذف والتشغيل اليدوي. أنشئ رمزا دقيقا (Fine-grained) لمستودع techdosenews فقط بصلاحيات Contents و Actions (قراءة وكتابة). يُحفظ في هذا المتصفح فقط ولا يُرسل لأي مكان غير GitHub. لا ترسله في أي محادثة.</p>' +
    '<input id="s-tok" type="password" dir="ltr" placeholder="github_pat_…" autocomplete="off"><div class="row"><button class="btn" id="s-save">حفظ واختبار</button><button class="btn sec" id="s-clear">حذف الرمز من هذا المتصفح</button></div><div id="s-res" class="note" style="margin-top:8px">' + (tok() ? 'يوجد رمز محفوظ.' : 'لا يوجد رمز (قراءة فقط).') + '</div></div>' +
    '<div class="card"><h2>تغيير كلمة المرور</h2><input id="s-pw" type="password" dir="ltr" placeholder="كلمة مرور جديدة (10 أحرف أو أكثر)" autocomplete="new-password"><div class="row"><button class="btn" id="s-pwb">تغيير</button></div>' +
    '<p class="note" style="margin-top:8px">تُحفظ كبصمة SHA-256 في admin_config.json. الدخول بوابة بسيطة في المتصفح؛ الحماية الفعلية للتعديل هي رمز GitHub. اختر كلمة طويلة وفريدة.</p></div>';
  $('#s-save').onclick = async function () {
    var v = $('#s-tok').value.trim(); if (!v) return;
    localStorage.setItem('td_gh_token', v); $('#s-tok').value = '';
    var r = await gh(''); var j = await r.json().catch(function () { return {}; });
    $('#s-res').textContent = r.ok ? (j.permissions && j.permissions.push ? 'الرمز يعمل وبصلاحية الكتابة.' : 'الرمز يعمل لكن بدون صلاحية كتابة.') : 'الرمز غير صالح (' + r.status + ').';
    if (!r.ok) localStorage.removeItem('td_gh_token');
  };
  $('#s-clear').onclick = function () { localStorage.removeItem('td_gh_token'); rSet(); toast('تم حذف الرمز'); };
  $('#s-pwb').onclick = async function () {
    var p = $('#s-pw').value; if (p.length < 10) return toast('كلمة المرور قصيرة');
    try { var cur = await readFresh('admin_config.json'); cur.json.passwordHash = await sha256(p); await commitJSON('admin_config.json', cur.json, 'Admin: change panel password'); $('#s-pw').value = ''; toast('تم تغيير كلمة المرور'); }
    catch (e) { toast('فشل: ' + e.message, 7000); }
  };
}

if (sessionStorage.getItem('td_admin') === '1') start();
