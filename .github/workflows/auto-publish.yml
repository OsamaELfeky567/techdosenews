name: Auto Publish Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'data/articles/index.json'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync articles_db.json
        run: node scripts/sync_articles.js

      - name: Generate sitemap.xml
        run: node scripts/generate-sitemap.js

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add articles_db.json sitemap.xml
          git diff --staged --quiet || git commit -m 'auto: sync db and sitemap [bot]'
          git push

      - name: Submit to IndexNow
        run: node scripts/submit-indexnow.js
