<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>لوحة التحكم — TD بالعربي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--bg:#0f172a;--bg2:#1e293b;--bg3:#334155;--surface:#1e293b;--surface2:#334155;--text:#f1f5f9;--text2:#94a3b8;--text3:#64748b;--primary:#3b82f6;--primary-hover:#2563eb;--green:#22c55e;--red:#ef4444;--orange:#f59e0b;--purple:#a855f7;--radius:10px;--shadow:0 4px 20px rgba(0,0,0,.3);font-family:'Cairo',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;min-height:100vh;direction:rtl}
input,select,textarea,button{font-family:inherit;font-size:.95rem}
a{color:var(--primary);text-decoration:none}
.login-page{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-card{background:var(--surface);padding:40px;border-radius:var(--radius);border:1px solid var(--bg3);width:100%;max-width:400px;text-align:center}
.login-card h1{font-size:1.5rem;margin-bottom:4px}
.login-card h1 span{color:var(--primary)}
.login-card p{color:var(--text2);font-size:.85rem;margin-bottom:24px}
.login-card input{width:100%;padding:12px 16px;border:1px solid var(--bg3);border-radius:8px;background:var(--bg2);color:var(--text);margin-bottom:12px;outline:none;transition:.2s}
.login-card input:focus{border-color:var(--primary)}
.login-card .error{color:var(--red);font-size:.85rem;margin-bottom:12px;display:none}
.login-card button{width:100%;padding:12px;border:none;border-radius:8px;background:var(--primary);color:#fff;font-weight:700;cursor:pointer;font-size:1rem;transition:.2s}
.login-card button:hover{background:var(--primary-hover)}
.app{display:none;min-height:100vh}
.app-header{background:var(--surface);padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bg3);position:sticky;top:0;z-index:100}
.app-header .logo{font-weight:900;font-size:1.1rem}
.app-header .logo span{color:var(--primary)}
.header-actions{display:flex;align-items:center;gap:12px}
.header-actions .user-badge{padding:4px 12px;background:var(--bg3);border-radius:20px;font-size:.8rem;color:var(--text2)}
.header-actions .logout-btn{padding:6px 14px;background:none;border:1px solid var(--bg3);color:var(--text2);border-radius:8px;cursor:pointer;transition:.2s;font-size:.85rem}
.header-actions .logout-btn:hover{border-color:var(--red);color:var(--red)}
.app-body{display:flex;min-height:calc(100vh - 60px)}
.sidebar{width:220px;background:var(--surface);padding:12px 0;border-left:1px solid var(--bg3);flex-shrink:0}
.sidebar .nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;color:var(--text2);cursor:pointer;transition:.2s;border-right:3px solid transparent}
.sidebar .nav-item:hover{background:var(--bg2);color:var(--text)}
.sidebar .nav-item.active{background:var(--bg2);color:var(--primary);border-right-color:var(--primary)}
.sidebar .nav-item i{width:18px;text-align:center;font-size:.9rem}
.main{padding:24px;flex:1;overflow-y:auto;max-width:calc(100% - 220px)}
.page{display:none}
.page.active{display:block}
.page-title{font-size:1.3rem;font-weight:700;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between}
.page-title .sub{font-size:.8rem;color:var(--text2);font-weight:400}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--surface);padding:20px;border-radius:var(--radius);border:1px solid var(--bg3)}
.stat-card .stat-label{font-size:.8rem;color:var(--text2);margin-bottom:4px}
.stat-card .stat-value{font-size:1.8rem;font-weight:900}
.stat-card .stat-sub{font-size:.75rem;color:var(--text3);margin-top:4px}
.toolbar{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.toolbar input,.toolbar select{padding:8px 12px;border:1px solid var(--bg3);border-radius:6px;background:var(--bg2);color:var(--text);outline:none}
.toolbar input:focus,.toolbar select:focus{border-color:var(--primary)}
.toolbar input{flex:1;min-width:200px}
.btn{padding:8px 16px;border:none;border-radius:6px;font-weight:600;cursor:pointer;transition:.2s;font-size:.85rem}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-hover)}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{background:#dc2626}
.btn-sm{padding:4px 10px;font-size:.8rem}
table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:var(--radius);overflow:hidden;border:1px solid var(--bg3)}
th,td{padding:10px 14px;text-align:right;border-bottom:1px solid var(--bg3);font-size:.85rem}
th{background:var(--bg2);color:var(--text2);font-weight:600}
td{color:var(--text)}
tr:hover{background:var(--bg2)}
.status-published{color:var(--green)}
.status-draft{color:var(--orange)}
.pagination{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.pagination button{padding:6px 12px;border:1px solid var(--bg3);border-radius:6px;background:var(--surface);color:var(--text2);cursor:pointer}
.pagination button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.pagination button:hover:not(.active){background:var(--bg2)}
.editor-form{max-width:800px;background:var(--surface);padding:24px;border-radius:var(--radius);border:1px solid var(--bg3)}
.editor-form .field{margin-bottom:16px}
.editor-form label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;font-weight:600}
.editor-form input,.editor-form select,.editor-form textarea{width:100%;padding:10px 14px;border:1px solid var(--bg3);border-radius:6px;background:var(--bg2);color:var(--text);outline:none;transition:.2s}
.editor-form textarea{min-height:200px;resize:vertical}
.editor-form input:focus,.editor-form select:focus,.editor-form textarea:focus{border-color:var(--primary)}
.editor-form .char-counter{text-align:left;font-size:.75rem;color:var(--text3);margin-top:2px}
.editor-form .image-preview{max-width:200px;border-radius:6px;margin-top:8px;display:none}
.editor-form .tag-preview{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.editor-form .tag-preview span{padding:2px 10px;background:var(--bg3);border-radius:4px;font-size:.8rem}
.editor-form .status-toggle{display:flex;gap:12px;align-items:center}
.editor-form .status-toggle label{display:flex;align-items:center;gap:6px;cursor:pointer}
.cat-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-bottom:16px}
.cat-card{background:var(--surface);padding:16px;border-radius:var(--radius);border:1px solid var(--bg3);display:flex;align-items:center;justify-content:space-between}
.cat-card .cat-info{display:flex;align-items:center;gap:10px}
.cat-card .cat-color{width:16px;height:16px;border-radius:4px;flex-shrink:0}
.cat-card .cat-name{font-weight:600}
.cat-card .cat-count{font-size:.8rem;color:var(--text2)}
.add-cat-form{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center;background:var(--surface);padding:16px;border-radius:var(--radius);border:1px solid var(--bg3)}
.add-cat-form input[type="text"]{flex:1;min-width:150px;padding:8px 12px;border:1px solid var(--bg3);border-radius:6px;background:var(--bg2);color:var(--text);outline:none}
.add-cat-form input[type="color"]{width:40px;height:40px;border:none;border-radius:6px;cursor:pointer;background:none}
.settings-form{max-width:600px;background:var(--surface);padding:24px;border-radius:var(--radius);border:1px solid var(--bg3)}
.settings-form .field{margin-bottom:16px}
.settings-form label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;font-weight:600}
.settings-form input{width:100%;padding:10px 14px;border:1px solid var(--bg3);border-radius:6px;background:var(--bg2);color:var(--text);outline:none;transition:.2s}
.settings-form input:focus{border-color:var(--primary)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:8px;font-weight:600;z-index:999;max-width:400px;text-align:center;animation:fadeIn .3s}
.toast-success{background:var(--green);color:#fff}
.toast-error{background:var(--red);color:#fff}
.toast-info{background:var(--primary);color:#fff}
@keyframes fadeIn{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.empty-state{padding:40px;text-align:center;color:var(--text3)}
.loading{text-align:center;padding:40px;color:var(--text2)}
.bulk-bar{background:var(--surface);padding:12px 16px;border-radius:var(--radius);border:1px solid var(--bg3);margin-bottom:12px;display:none;align-items:center;gap:12px}
.bulk-bar span{font-size:.85rem;color:var(--text2)}
@media(max-width:768px){.sidebar{width:60px}.sidebar .nav-item span{display:none}.main{max-width:calc(100% - 60px)}.stats-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="login-page" id="loginPage">
  <div class="login-card">
    <h1>TD <span>بالعربي</span></h1>
    <p>لوحة التحكم</p>
    <input type="password" id="loginPassword" placeholder="كلمة المرور" onkeydown="if(event.key==='Enter')login()">
    <div class="error" id="loginError">كلمة المرور غير صحيحة</div>
    <button onclick="login()">دخول</button>
  </div>
</div>
<div class="app" id="app">
  <header class="app-header">
    <div class="logo">TD <span>بالعربي</span> <span style="font-size:.75rem;color:var(--text2);font-weight:400;">لوحة التحكم</span></div>
    <div class="header-actions">
      <span class="user-badge" id="headerDate"></span>
      <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> خروج</button>
    </div>
  </header>
  <div class="app-body">
    <nav class="sidebar" id="sidebar">
      <div class="nav-item active" data-page="dashboard" onclick="showPage('dashboard')"><i class="fas fa-chart-bar"></i><span>الإحصائيات</span></div>
      <div class="nav-item" data-page="articles" onclick="showPage('articles')"><i class="fas fa-newspaper"></i><span>المقالات</span></div>
      <div class="nav-item" data-page="editor" onclick="showPage('editor')"><i class="fas fa-edit"></i><span>محرر المقالات</span></div>
      <div class="nav-item" data-page="categories" onclick="showPage('categories')"><i class="fas fa-tags"></i><span>التصنيفات</span></div>
      <div class="nav-item" data-page="settings" onclick="showPage('settings')"><i class="fas fa-cog"></i><span>الإعدادات</span></div>
    </nav>
    <main class="main">
      <div class="page active" id="page-dashboard">
        <div class="page-title">لوحة المعلومات <span class="sub">نظرة عامة على الموقع</span></div>
        <div class="stats-grid" id="statsGrid"></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
          <div style="background:var(--surface);padding:20px;border-radius:var(--radius);border:1px solid var(--bg3)">
            <h3 style="font-size:1rem;margin-bottom:12px">أفضل 5 تصنيفات</h3>
            <div id="topCategories"></div>
          </div>
          <div style="background:var(--surface);padding:20px;border-radius:var(--radius);border:1px solid var(--bg3)">
            <h3 style="font-size:1rem;margin-bottom:12px">آخر المقالات</h3>
            <div id="latestArticles"></div>
          </div>
        </div>
      </div>
      <div class="page" id="page-articles">
        <div class="page-title">المقالات <span class="sub" id="articlesCount"></span></div>
        <div class="bulk-bar" id="bulkBar"><span id="bulkCount"></span><button class="btn btn-danger btn-sm" onclick="bulkDelete()">حذف المحدد</button><button class="btn btn-sm" style="background:var(--bg3);color:var(--text)" onclick="clearBulk()">إلغاء</button></div>
        <div class="toolbar">
          <input type="text" id="searchInput" placeholder="بحث بالعنوان..." oninput="renderArticles()">
          <select id="catFilter" onchange="renderArticles()"><option value="">جميع التصنيفات</option></select>
          <select id="statusFilter" onchange="renderArticles()"><option value="">جميع الحالات</option><option value="published">منشور</option><option value="draft">مسودة</option></select>
          <button class="btn btn-primary" onclick="showPage('editor')"><i class="fas fa-plus"></i> مقال جديد</button>
        </div>
        <div id="articlesTable"></div>
        <div class="pagination" id="pagination"></div>
      </div>
      <div class="page" id="page-editor">
        <div class="page-title" id="editorTitle">محرر المقالات <span class="sub">إضافة / تعديل مقال</span></div>
        <div class="editor-form">
          <input type="hidden" id="editId">
          <div class="field"><label>العنوان (بالعربية) <span id="titleCounter" style="font-size:.75rem;color:var(--text3)">0/60</span></label><input type="text" id="articleTitle" placeholder="عنوان المقال" oninput="updateCounters()" required></div>
          <div class="field"><label>الملخص <span id="excerptCounter" style="font-size:.75rem;color:var(--text3)">0/160</span></label><textarea id="articleExcerpt" rows="3" placeholder="ملخص المقال (160 حرف كحد أقصى)" oninput="updateCounters()" style="min-height:60px"></textarea></div>
          <div class="field"><label>المحتوى <span id="bodyCounter" style="font-size:.75rem;color:var(--text3)">0 كلمة</span></label><textarea id="articleBody" placeholder="محتوى المقال كاملاً بصيغة HTML" oninput="updateCounters()"></textarea></div>
          <div class="field"><label>التصنيف</label><select id="articleCategory"></select></div>
          <div class="field"><label>الكلمات المفتاحية (مفصولة بفواصل)</label><input type="text" id="articleTags" placeholder="تكنولوجيا, ذكاء اصطناعي, ChatGPT" oninput="renderTagPreview()"><div class="tag-preview" id="tagPreview"></div></div>
          <div class="field"><label>رابط الصورة</label><input type="url" id="articleImage" placeholder="https://example.com/image.jpg" oninput="previewImage()"><img class="image-preview" id="imagePreview" alt="معاينة الصورة"></div>
          <div class="field"><label>رابط المصدر الأصلي</label><input type="url" id="articleSource" placeholder="https://example.com/article"></div>
          <div class="field"><label>التاريخ والوقت</label><input type="datetime-local" id="articleDate"></div>
          <div class="field"><label>الحالة</label><div class="status-toggle"><label><input type="radio" name="status" value="published" checked> منشور</label><label><input type="radio" name="status" value="draft"> مسودة</label></div></div>
          <div style="display:flex;gap:8px;margin-top:16px"><button class="btn btn-primary" onclick="saveArticle()" id="saveBtn">حفظ المقال</button><button class="btn" style="background:var(--bg3);color:var(--text)" onclick="resetEditor()">إلغاء</button></div>
        </div>
      </div>
      <div class="page" id="page-categories">
        <div class="page-title">التصنيفات <span class="sub">إدارة تصنيفات الموقع</span></div>
        <div class="add-cat-form">
          <input type="text" id="newCatName" placeholder="اسم التصنيف الجديد">
          <input type="color" id="newCatColor" value="#3b82f6">
          <button class="btn btn-primary" onclick="addCategory()">إضافة</button>
        </div>
        <div class="cat-list" id="catList"></div>
      </div>
      <div class="page" id="page-settings">
        <div class="page-title">الإعدادات <span class="sub">إعدادات الموقع والتكاملات</span></div>
        <div class="settings-form">
          <div class="field"><label>اسم الموقع</label><input type="text" id="setSiteName" placeholder="TD بالعربي"></div>
          <div class="field"><label>وصف الموقع</label><input type="text" id="setSiteDesc" placeholder="منصة إخبارية عربية"></div>
          <div class="field"><label>رابط الموقع</label><input type="url" id="setSiteUrl" placeholder="https://td-arabi.com"></div>
          <div class="field"><label>GitHub Token <span style="font-size:.75rem;color:var(--text3)">(مطلوب للحفظ)</span></label><input type="password" id="setGhToken" placeholder="ghp_..."></div>
          <div class="field"><label>Telegram Bot Token</label><input type="password" id="setTeleBot" placeholder="123456:ABC-DEF"></div>
          <div class="field"><label>Telegram Channel ID</label><input type="text" id="setTeleChan" placeholder="@channel_id"></div>
          <div class="field"><label>Gemini API Key</label><input type="password" id="setGeminiKey" placeholder="AIza..."></div>
          <div class="field"><label>IndexNow Key</label><input type="text" id="setIndexNowKey" placeholder="30b3490761e54946bcce8a978d5d218c"></div>
          <button class="btn btn-primary" onclick="saveSettings()">حفظ الإعدادات</button>
        </div>
      </div>
    </main>
  </div>
</div>
<script>
const GH_OWNER = 'osamaelfeky567';
const GH_REPO = 'techdosenews';
const GH_API = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}`;
const RAW_URL = `https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/main`;

let CONFIG = {};
let ARTICLES = [];
let CATEGORIES = [];
let CURRENT_PAGE = 1;
const PER_PAGE = 20;
let SELECTED_IDS = new Set();

function sha256(str) {
  const encoder = new TextEncoder();
  const data = encoder.encode(str);
  return crypto.subtle.digest('SHA-256', data).then(hash => {
    return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('');
  });
}

async function login() {
  const input = document.getElementById('loginPassword');
  const err = document.getElementById('loginError');
  const hash = await sha256(input.value);
  const stored = CONFIG.passwordHash || '';
  if (stored && hash !== stored) { err.style.display = 'block'; return; }
  if (!stored && input.value !== 'admin123') { err.style.display = 'block'; return; }
  err.style.display = 'none';
  sessionStorage.setItem('tdn_admin_token', 'authenticated');
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  init();
}

function logout() {
  sessionStorage.removeItem('tdn_admin_token');
  location.reload();
}

function showToast(msg, type) {
  const t = document.createElement('div');
  t.className = 'toast toast-' + type;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

async function ghGet(path) {
  const res = await fetch(GH_API + '/contents/' + path, { headers: { Accept: 'application/vnd.github.v3.raw' } });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

async function ghPut(path, content, message) {
  const token = CONFIG.ghToken || sessionStorage.getItem('gh_token') || '';
  if (!token) throw new Error('GitHub Token is required');
  let sha = null;
  try {
    const existing = await fetch(GH_API + '/contents/' + path, { headers: { Authorization: 'token ' + token } });
    if (existing.ok) { const data = await existing.json(); sha = data.sha; }
  } catch(e) {}
  const body = { message: message || 'Update via admin panel', content: btoa(unescape(encodeURIComponent(content))), branch: 'main' };
  if (sha) body.sha = sha;
  const res = await fetch(GH_API + '/contents/' + path, { method: 'PUT', headers: { Authorization: 'token ' + token, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!res.ok) { const err = await res.json(); throw new Error(err.message || 'HTTP ' + res.status); }
  return res.json();
}

async function loadConfig() {
  try {
    const res = await fetch(RAW_URL + '/admin_config.json?t=' + Date.now());
    if (res.ok) CONFIG = await res.json();
  } catch(e) { CONFIG = {}; }
  if (!CONFIG.passwordHash && CONFIG.passwordHash !== '') CONFIG.passwordHash = '';
}

async function loadArticles() {
  try {
    ARTICLES = await ghGet('data/articles/index.json');
  } catch(e) {
    try { const res = await fetch(RAW_URL + '/data/articles/index.json?t=' + Date.now()); if (res.ok) ARTICLES = await res.json(); } catch(e2) {}
  }
  if (!Array.isArray(ARTICLES)) ARTICLES = [];
}

async function loadCategories() {
  try {
    CATEGORIES = await ghGet('data/categories.json');
  } catch(e) {
    try { const res = await fetch(RAW_URL + '/data/categories.json?t=' + Date.now()); if (res.ok) CATEGORIES = await res.json(); } catch(e2) {}
  }
  if (!Array.isArray(CATEGORIES)) CATEGORIES = [];
}

function getTodayStr() { return new Date().toISOString().substring(0, 10); }

function renderDashboard() {
  const total = ARTICLES.length;
  const today = ARTICLES.filter(a => { const d = a.date || a.publishedAt || ''; return d.substring(0, 10) === getTodayStr(); }).length;
  const week = ARTICLES.filter(a => { const d = a.date || a.publishedAt || ''; if (!d) return false; const ts = new Date(d).getTime(); return Date.now() - ts < 7 * 86400000; }).length;
  const month = ARTICLES.filter(a => { const d = a.date || a.publishedAt || ''; if (!d) return false; const ts = new Date(d).getTime(); return Date.now() - ts < 30 * 86400000; }).length;
  const first = ARTICLES.length > 1 ? new Date(ARTICLES[ARTICLES.length - 1]?.date || ARTICLES[ARTICLES.length - 1]?.publishedAt || Date.now()).getTime() : Date.now();
  const daysActive = Math.max(1, (Date.now() - first) / 86400000);
  const rate = (total / daysActive).toFixed(1);
  document.getElementById('statsGrid').innerHTML =
    '<div class="stat-card"><div class="stat-label">إجمالي المقالات</div><div class="stat-value">' + total + '</div></div>' +
    '<div class="stat-card"><div class="stat-label">اليوم</div><div class="stat-value">' + today + '</div></div>' +
    '<div class="stat-card"><div class="stat-label">هذا الأسبوع</div><div class="stat-value">' + week + '</div></div>' +
    '<div class="stat-card"><div class="stat-label">هذا الشهر</div><div class="stat-value">' + month + '</div></div>' +
    '<div class="stat-card"><div class="stat-label">معدل النشر (يوميًا)</div><div class="stat-value">' + rate + '</div></div>';
  const catCounts = {};
  ARTICLES.forEach(a => { const c = a.categoryAr || a.category || 'أخرى'; catCounts[c] = (catCounts[c] || 0) + 1; });
  const topCats = Object.entries(catCounts).sort((a,b) => b[1] - a[1]).slice(0, 5);
  document.getElementById('topCategories').innerHTML = topCats.length ? topCats.map(([c,n]) =>
    '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bg3);font-size:.85rem"><span>' + c + '</span><span style="color:var(--text2)">' + n + '</span></div>'
  ).join('') : '<div class="empty-state">لا توجد تصنيفات</div>';
  const latest = ARTICLES.slice(0, 10);
  document.getElementById('latestArticles').innerHTML = latest.length ? latest.map(a =>
    '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bg3);font-size:.85rem"><span>' + (a.title_ar || a.title || '').substring(0, 40) + '</span><span style="color:var(--text2);font-size:.75rem">' + (a.date || a.publishedAt || '').substring(0, 10) + '</span></div>'
  ).join('') : '<div class="empty-state">لا توجد مقالات</div>';
}

function renderArticles() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const cat = document.getElementById('catFilter').value;
  const status = document.getElementById('statusFilter').value;
  let filtered = ARTICLES.filter(a => {
    const title = (a.title_ar || a.title || '').toLowerCase();
    if (search && !title.includes(search)) return false;
    if (cat && a.canonicalCategory !== cat && a.category !== cat) return false;
    if (status && a.status !== status) return false;
    return true;
  });
  document.getElementById('articlesCount').textContent = '(' + filtered.length + ' مقال)';
  const totalPages = Math.max(1, Math.ceil(filtered.length / PER_PAGE));
  if (CURRENT_PAGE > totalPages) CURRENT_PAGE = totalPages;
  const start = (CURRENT_PAGE - 1) * PER_PAGE;
  const page = filtered.slice(start, start + PER_PAGE);
  const catOpts = document.getElementById('catFilter');
  if (catOpts.options.length <= 1) {
    const seen = new Set();
    ARTICLES.forEach(a => { const c = a.canonicalCategory || a.category || ''; if (c && !seen.has(c)) { seen.add(c); const o = document.createElement('option'); o.value = c; o.textContent = a.categoryAr || c; catOpts.appendChild(o); } });
  }
  const tb = document.getElementById('articlesTable');
  if (!page.length) { tb.innerHTML = '<div class="empty-state">لا توجد مقالات تطابق البحث</div>'; document.getElementById('pagination').innerHTML = ''; return; }
  tb.innerHTML = '<table><thead><tr><th style="width:30px"><input type="checkbox" onchange="toggleAll(this.checked)"></th><th style="width:50px">الصورة</th><th>العنوان</th><th>التاريخ</th><th>التصنيف</th><th>تحسين محركات</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody>' +
    page.map(a => {
      const seoScore = a.seo_score || 0;
      const seoGrade = seoScore >= 85 ? 'A' : seoScore >= 70 ? 'B' : seoScore >= 55 ? 'C' : seoScore >= 40 ? 'D' : 'F';
      const gradeColors = {A:'#238636',B:'#1f6feb',C:'#d29922',D:'#db6d28',F:'#da3633'};
      const imgUrl = a.image_url || a.image || '';
      const imgTag = imgUrl ? '<img src="' + imgUrl + '" alt="" style="width:44px;height:32px;border-radius:4px;object-fit:cover;border:1px solid var(--bg3)" loading="lazy" onerror="this.style.display=\'none\'">' : '<span style="color:var(--text3);font-size:.7rem">—</span>';
      return '<tr>' +
      '<td><input type="checkbox" ' + (SELECTED_IDS.has(a.id) ? 'checked' : '') + ' onchange="toggleSelect(\'' + a.id + '\',this.checked)"></td>' +
      '<td>' + imgTag + '</td>' +
      '<td>' + (a.title_ar || a.title || '').substring(0, 50) + '</td>' +
      '<td style="font-size:.8rem;color:var(--text2)">' + (a.date || a.publishedAt || '').substring(0, 10) + '</td>' +
      '<td>' + (a.categoryAr || a.category || '—') + '</td>' +
      '<td><span style="background:' + (gradeColors[seoGrade] || '#555') + ';color:#fff;padding:2px 8px;border-radius:4px;font-size:.75rem;font-weight:700">' + seoGrade + ' ' + seoScore + '</span></td>' +
      '<td class="status-' + (a.status || 'published') + '">' + (a.status === 'draft' ? 'مسودة' : 'منشور') + '</td>' +
      '<td style="display:flex;gap:4px"><button class="btn btn-sm btn-primary" onclick="editArticle(\'' + a.id + '\')"><i class="fas fa-edit"></i></button><button class="btn btn-sm btn-danger" onclick="deleteArticle(\'' + a.id + '\')"><i class="fas fa-trash"></i></button><button class="btn btn-sm" style="background:var(--bg3);color:var(--text)" onclick="window.open(\'/article.html?id=' + a.id + '\',\'_blank\')"><i class="fas fa-external-link-alt"></i></button></td>' +
      '</tr>';
    }).join('') + '</tbody></table>';
  let p = '';
  for (let i = 1; i <= totalPages; i++) {
    p += '<button class="' + (i === CURRENT_PAGE ? 'active' : '') + '" onclick="CURRENT_PAGE=' + i + ';renderArticles()">' + i + '</button>';
  }
  document.getElementById('pagination').innerHTML = p;
  document.getElementById('bulkCount').textContent = SELECTED_IDS.size + ' مقال محدد';
  document.getElementById('bulkBar').style.display = SELECTED_IDS.size ? 'flex' : 'none';
}

function toggleAll(checked) {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const filtered = ARTICLES.filter(a => (a.title_ar || a.title || '').toLowerCase().includes(search));
  filtered.forEach(a => { if (checked) SELECTED_IDS.add(a.id); else SELECTED_IDS.delete(a.id); });
  renderArticles();
}

function toggleSelect(id, checked) { if (checked) SELECTED_IDS.add(id); else SELECTED_IDS.delete(id); renderArticles(); }

function clearBulk() { SELECTED_IDS.clear(); renderArticles(); }

async function bulkDelete() {
  if (!confirm('حذف ' + SELECTED_IDS.size + ' مقال؟')) return;
  ARTICLES = ARTICLES.filter(a => !SELECTED_IDS.has(a.id));
  SELECTED_IDS.clear();
  try { await ghPut('data/articles/index.json', JSON.stringify(ARTICLES, null, 2), 'admin: bulk delete articles'); showToast('تم الحذف', 'success'); } catch(e) { showToast('خطأ في الحفظ: ' + e.message, 'error'); }
  renderDashboard();
  renderArticles();
}

function editArticle(id) {
  const a = ARTICLES.find(x => x.id === id);
  if (!a) return;
  document.getElementById('editId').value = id;
  document.getElementById('articleTitle').value = a.title_ar || a.title || '';
  document.getElementById('articleExcerpt').value = a.excerpt || '';
  document.getElementById('articleBody').value = a.body || '';
  document.getElementById('articleCategory').value = a.canonicalCategory || a.category || '';
  document.getElementById('articleTags').value = Array.isArray(a.tags) ? a.tags.join(', ') : (a.tags || '');
  document.getElementById('articleImage').value = a.image_url || a.image || '';
  document.getElementById('articleSource').value = a.source_link || a.link || '';
  document.getElementById('articleDate').value = (a.date || a.publishedAt || '').substring(0, 16);
  const radios = document.getElementsByName('status');
  for (const r of radios) { r.checked = (r.value === (a.status || 'published')); }
  previewImage();
  renderTagPreview();
  updateCounters();
  document.getElementById('editorTitle').innerHTML = 'تعديل المقال <span class="sub">تعديل: ' + (a.title_ar || a.title || '').substring(0, 30) + '</span>';
  document.getElementById('saveBtn').textContent = 'تحديث المقال';
  showPage('editor');
}

function resetEditor() {
  document.getElementById('editId').value = '';
  document.getElementById('articleTitle').value = '';
  document.getElementById('articleExcerpt').value = '';
  document.getElementById('articleBody').value = '';
  document.getElementById('articleCategory').value = '';
  document.getElementById('articleTags').value = '';
  document.getElementById('articleImage').value = '';
  document.getElementById('articleSource').value = '';
  document.getElementById('articleDate').value = new Date().toISOString().substring(0, 16);
  const radios = document.getElementsByName('status');
  for (const r of radios) { r.checked = r.value === 'published'; }
  document.getElementById('imagePreview').style.display = 'none';
  document.getElementById('tagPreview').innerHTML = '';
  document.getElementById('editorTitle').innerHTML = 'محرر المقالات <span class="sub">إضافة / تعديل مقال</span>';
  document.getElementById('saveBtn').textContent = 'حفظ المقال';
  updateCounters();
}

async function saveArticle() {
  const title = document.getElementById('articleTitle').value.trim();
  if (!title) { showToast('العنوان مطلوب', 'error'); return; }
  const id = document.getElementById('editId').value || 'art-' + Date.now() + '-' + Math.random().toString(36).substring(2, 8);
  const excerpt = document.getElementById('articleExcerpt').value.trim();
  const body = document.getElementById('articleBody').value.trim();
  const category = document.getElementById('articleCategory').value;
  const tags = document.getElementById('articleTags').value.split(',').map(t => t.trim()).filter(Boolean);
  const image = document.getElementById('articleImage').value.trim();
  const source = document.getElementById('articleSource').value.trim();
  const date = document.getElementById('articleDate').value ? new Date(document.getElementById('articleDate').value).toISOString() : new Date().toISOString();
  const status = document.querySelector('input[name="status"]:checked')?.value || 'published';
  const catObj = CATEGORIES.find(c => c.id === category);
  const article = {
    id, title_ar: title, title: '', excerpt, body, category: catObj?.id || category || 'companies',
    canonicalCategory: catObj?.id || 'companies', categoryAr: catObj?.name || 'شركات',
    tags, image_url: image, image: image, source_link: source, date, publishedAt: date,
    status, featured: false, source: 'Tech News', readTime: '1 min read', views: '0', hasEgyptImpact: false
  };
  const idx = ARTICLES.findIndex(a => a.id === id);
  if (idx >= 0) ARTICLES[idx] = article;
  else ARTICLES.unshift(article);
  try {
    await ghPut('data/articles/index.json', JSON.stringify(ARTICLES, null, 2), 'admin: ' + (idx >= 0 ? 'update' : 'create') + ' article - ' + title.substring(0, 50));
    showToast(idx >= 0 ? 'تم تحديث المقال' : 'تم إضافة المقال', 'success');
    renderDashboard();
    resetEditor();
    showPage('articles');
  } catch(e) { showToast('خطأ في الحفظ: ' + e.message, 'error'); }
}

async function deleteArticle(id) {
  if (!confirm('حذف هذا المقال؟')) return;
  ARTICLES = ARTICLES.filter(a => a.id !== id);
  try {
    await ghPut('data/articles/index.json', JSON.stringify(ARTICLES, null, 2), 'admin: delete article ' + id);
    showToast('تم الحذف', 'success');
  } catch(e) { showToast('خطأ في الحفظ: ' + e.message, 'error'); }
  renderDashboard();
  renderArticles();
}

function updateCounters() {
  const t = document.getElementById('articleTitle').value.length;
  document.getElementById('titleCounter').textContent = t + '/60';
  const e = document.getElementById('articleExcerpt').value.length;
  document.getElementById('excerptCounter').textContent = e + '/160';
  const b = document.getElementById('articleBody').value.trim().split(/\s+/).filter(Boolean).length;
  document.getElementById('bodyCounter').textContent = b + ' كلمة';
}

function renderTagPreview() {
  const tags = document.getElementById('articleTags').value.split(',').map(t => t.trim()).filter(Boolean);
  document.getElementById('tagPreview').innerHTML = tags.map(t => '<span>' + t + '</span>').join('');
}

function previewImage() {
  const url = document.getElementById('articleImage').value.trim();
  const img = document.getElementById('imagePreview');
  if (url) { img.src = url; img.style.display = 'block'; } else { img.style.display = 'none'; }
}

function renderCategories() {
  const catCounts = {};
  ARTICLES.forEach(a => { const c = a.canonicalCategory || a.category || ''; if (c) catCounts[c] = (catCounts[c] || 0) + 1; });
  document.getElementById('catList').innerHTML = CATEGORIES.map(c =>
    '<div class="cat-card"><div class="cat-info"><div class="cat-color" style="background:' + (c.color || '#3b82f6') + '"></div><div><div class="cat-name">' + c.name + '</div><div class="cat-count">' + (catCounts[c.id] || 0) + ' مقال</div></div></div><button class="btn btn-sm btn-danger" onclick="deleteCategory(\'' + c.id + '\')"><i class="fas fa-trash"></i></button></div>'
  ).join('');
}

async function addCategory() {
  const name = document.getElementById('newCatName').value.trim();
  if (!name) { showToast('اسم التصنيف مطلوب', 'error'); return; }
  const id = name.replace(/\s+/g, '-').toLowerCase();
  if (CATEGORIES.find(c => c.id === id)) { showToast('التصنيف موجود بالفعل', 'error'); return; }
  const color = document.getElementById('newCatColor').value;
  CATEGORIES.push({ id, name, color, keywords: [] });
  try {
    await ghPut('data/categories.json', JSON.stringify(CATEGORIES, null, 2), 'admin: add category ' + name);
    showToast('تم إضافة التصنيف', 'success');
    document.getElementById('newCatName').value = '';
    renderCategories();
  } catch(e) { showToast('خطأ في الحفظ: ' + e.message, 'error'); CATEGORIES.pop(); }
}

async function deleteCategory(id) {
  if (!confirm('حذف هذا التصنيف؟')) return;
  CATEGORIES = CATEGORIES.filter(c => c.id !== id);
  try {
    await ghPut('data/categories.json', JSON.stringify(CATEGORIES, null, 2), 'admin: delete category ' + id);
    showToast('تم الحذف', 'success');
    renderCategories();
  } catch(e) { showToast('خطأ في الحفظ: ' + e.message, 'error'); }
}

async function saveSettings() {
  const fields = {
    siteName: document.getElementById('setSiteName').value.trim(),
    siteDesc: document.getElementById('setSiteDesc').value.trim(),
    siteUrl: document.getElementById('setSiteUrl').value.trim(),
    ghToken: document.getElementById('setGhToken').value.trim(),
    telegramBotToken: document.getElementById('setTeleBot').value.trim(),
    telegramChannelId: document.getElementById('setTeleChan').value.trim(),
    geminiKey: document.getElementById('setGeminiKey').value.trim(),
    indexNowKey: document.getElementById('setIndexNowKey').value.trim()
  };
  Object.assign(CONFIG, fields);
  if (fields.ghToken) sessionStorage.setItem('gh_token', fields.ghToken);
  try {
    await ghPut('admin_config.json', JSON.stringify(CONFIG, null, 2), 'admin: update settings');
    showToast('تم حفظ الإعدادات', 'success');
  } catch(e) { showToast('خطأ في الحفظ: ' + e.message, 'error'); }
}

function loadSettings() {
  document.getElementById('setSiteName').value = CONFIG.siteName || '';
  document.getElementById('setSiteDesc').value = CONFIG.siteDesc || '';
  document.getElementById('setSiteUrl').value = CONFIG.siteUrl || 'https://td-arabi.com';
  document.getElementById('setGhToken').value = CONFIG.ghToken || '';
  document.getElementById('setTeleBot').value = CONFIG.telegramBotToken || '';
  document.getElementById('setTeleChan').value = CONFIG.telegramChannelId || '';
  document.getElementById('setGeminiKey').value = CONFIG.geminiKey || '';
  document.getElementById('setIndexNowKey').value = CONFIG.indexNowKey || '';
}

function populateCategorySelect() {
  const sel = document.getElementById('articleCategory');
  sel.innerHTML = '<option value="">اختر التصنيف</option>' + CATEGORIES.map(c => '<option value="' + c.id + '">' + c.name + '</option>').join('');
}

function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.querySelector('[data-page="' + name + '"]')?.classList.add('active');
}

async function init() {
  await loadArticles();
  await loadCategories();
  document.getElementById('headerDate').textContent = new Date().toLocaleDateString('ar-EG', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  populateCategorySelect();
  loadSettings();
  renderDashboard();
  renderArticles();
  renderCategories();
  CURRENT_PAGE = 1;
}

(async function() {
  await loadConfig();
  const authed = sessionStorage.getItem('tdn_admin_token');
  if (authed) {
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    init();
  } else {
    if (!CONFIG.passwordHash) {
      const h = await sha256('admin123');
      CONFIG.passwordHash = h;
    }
  }
})();
</script>
</body>
</html>
